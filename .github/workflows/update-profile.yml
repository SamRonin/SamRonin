name: Update profile

on:
  schedule:
    # every 6 hours; GitHub may run it a few minutes late during peak hours
    - cron: "17 */6 * * *"
  workflow_dispatch:        # manual trigger from the Actions tab
  push:
    branches: [main]
    paths:                  # re-render if the generator itself changes
      - "scripts/profile.py"
      - ".github/workflows/update-profile.yml"
      - "tests/**"

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # the only permission this job needs (push regenerated files)

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run offline test-suite (no network, no token)
        run: python3 -m unittest discover -s tests -v

      - name: Regenerate assets and README from live GitHub data
        env:
          # a repo-scoped token; only needs read access to public data,
          # but a PAT also lifts the anonymous API rate limit
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_LOGIN: SamRonin
        run: python3 scripts/profile.py

      - name: Validate generated SVGs and README asset links
        run: |
          python3 - <<'PY'
          import glob, os, re, sys, xml.etree.ElementTree as ET
          bad = []
          svgs = sorted(glob.glob("assets/*.svg"))
          for f in svgs:
              try:
                  ET.parse(f)
              except Exception as e:
                  bad.append(f"{f}: {e}")
          readme = open("README.md", encoding="utf-8").read()
          for ref in re.findall(r"assets/[\w./-]+\.svg", readme):
              if not os.path.isfile(ref):
                  bad.append(f"README references missing asset: {ref}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"all {len(svgs)} SVG assets are well-formed and every README asset link resolves")
          PY

      - name: Commit if anything actually changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md summary.md assets/
          if git diff --cached --quiet; then
            echo "profile is already up to date — nothing to commit"
            exit 0
          fi
          git commit -m "chore(profile): auto-refresh from GitHub API [skip ci]"
          git push
